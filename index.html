<style>
/* Layout: bilingual (AR/EN) guide; sticky filter bar over a two-column card grid, then a "list your restaurant" band with plans and an inquiry form. */
:root{
  --bg:#f6f8f7; --surface:#ffffff; --ink:#132622; --muted:#5a6b67; --line:#dbe3e0;
  --accent:#0d6b5e; --accent-ink:#ffffff; --saffron:#c98a06; --chip:#e8efed; --warn:#9a5b00; --band:#0d3b34; --band-ink:#eef6f3; --band-muted:#a9c7c0;
  --display-en:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --body-en:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --display-ar:"Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif; --body-ar:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1716; --surface:#152220; --ink:#e6efec; --muted:#9db0ab; --line:#263834;
  --accent:#4cc3ad; --accent-ink:#06211c; --saffron:#f0b43a; --chip:#1d2e2b; --warn:#f0b43a; --band:#122d29; --band-ink:#e6efec; --band-muted:#9db0ab; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1716; --surface:#152220; --ink:#e6efec; --muted:#9db0ab; --line:#263834;
  --accent:#4cc3ad; --accent-ink:#06211c; --saffron:#f0b43a; --chip:#1d2e2b; --warn:#f0b43a; --band:#122d29; --band-ink:#e6efec; --band-muted:#9db0ab; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55}
#app{--display:var(--display-en);--body:var(--body-en);font-family:var(--body)}
#app[lang="ar"]{--display:var(--display-ar);--body:var(--body-ar);line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topnav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px 0}
.brand{font-family:var(--display);font-weight:800;font-size:18px}
.navlinks{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.langbtn{font:inherit;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer}
.navcta{font-weight:700;font-size:14px;text-decoration:none;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:6px 14px}
header.top{padding-block:22px 20px}
.eyebrow{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.06em}
h1{font-family:var(--display);font-weight:800;font-size:clamp(32px,6vw,56px);line-height:1.1;margin:.2em 0 .3em;text-wrap:balance}
#app[lang="ar"] h1{line-height:1.35}
h1 span{color:var(--saffron)}
.lede{max-width:62ch;color:var(--muted);margin:0}
.stats{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:18px;font-variant-numeric:tabular-nums}
.stats b{font-family:var(--display);font-size:22px;display:block;color:var(--ink)}
.stats div{color:var(--muted);font-size:14px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:12px}
.controls{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:10px}
.controls label,.form label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:84px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tiers{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.tiers span{font-size:13px;color:var(--muted);margin-inline-end:4px}
.chipbtn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 14px;cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.result{color:var(--muted);font-size:14px;margin:16px 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding-bottom:40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.card h2{font-family:var(--display);font-size:19px;font-weight:700;margin:0;line-height:1.3;text-wrap:balance}
.meta{color:var(--muted);font-size:14px;margin-top:2px}
.score{text-align:end;flex:none;font-variant-numeric:tabular-nums}
.score b{font-family:var(--display);font-size:22px;line-height:1;color:var(--ink)}
.score .star{color:var(--saffron)}
.score small{display:block;color:var(--muted);font-size:12px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;background:var(--chip);border-radius:6px;padding:1px 9px;color:var(--ink)}
.tag.price{font-weight:700;color:var(--accent)}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14.5px}
dt{color:var(--muted);font-size:13px;font-weight:600}
dd{margin:0;min-width:0}
.ltr{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.note{font-size:14px;color:var(--warn)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:4px}
.btn{display:inline-flex;align-items:center;font:inherit;font-weight:600;font-size:14px;text-decoration:none;border-radius:8px;padding:6px 12px;border:1px solid var(--accent);color:var(--accent);background:transparent;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.empty{padding:40px 0;color:var(--muted)}

/* Restaurant listing band */
.band{background:var(--band);color:var(--band-ink)}
.band .wrap{padding-block:44px}
.band h2{font-family:var(--display);font-size:clamp(26px,4vw,38px);margin:0 0 6px;line-height:1.25;text-wrap:balance}
.band .sub{color:var(--band-muted);max-width:62ch;margin:0 0 24px}
.plans{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.plan{background:var(--surface);color:var(--ink);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0;border:1px solid var(--line)}
.plan.hl{border:2px solid var(--saffron)}
.plan h3{margin:0;font-family:var(--display);font-size:18px}
.plan .price{font-family:var(--display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.plan .price small{font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted)}
.plan ul{margin:4px 0 0;padding-inline-start:18px;font-size:14px;color:var(--muted)}
.plan ul li{margin-bottom:3px}
.contact{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px;margin-top:28px}
.contact .panel{background:var(--surface);color:var(--ink);border-radius:12px;padding:18px;min-width:0}
.contact h3{font-family:var(--display);font-size:18px;margin:0 0 10px}
.crow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px;border-bottom:1px solid var(--line)}
.crow:last-of-type{border-bottom:0}
.crow .lbl{font-size:13px;color:var(--muted);font-weight:600}
.crow .val{font-weight:700;font-size:16px;word-break:break-all;user-select:all}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
.formactions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.status{font-size:13px;color:var(--muted)}
footer{border-top:1px solid var(--line);padding-block:20px 40px;color:var(--muted);font-size:14px}
footer p{max-width:75ch;margin:.4em 0}
@media (max-width:980px){.plans{grid-template-columns:repeat(2,minmax(0,1fr))}.contact{grid-template-columns:1fr}}
@media (max-width:900px){.controls{grid-template-columns:1fr 1fr}.controls .search{grid-column:1/-1}}
@media (max-width:680px){.grid{grid-template-columns:1fr}.bar{position:static}.form{grid-template-columns:1fr}}
@media (max-width:460px){.plans{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--accent)}}
</style>
</head>

reviews:"reviews",dOrder:"Order",dCost:"Cost",dHours:"Hours",dReach:"Reach",dPhone:"Phone",est:"(est.)",bDir:"Directions",bMaps:"Menu, photos & reviews",bMenu:"Find full menu",
tiers:{1:["Budget","AED 40–90 for two"],2:["Mid-range","AED 120–250 for two"],3:["Upscale","AED 300–550 for two"],4:["Fine dining","AED 600+ for two"]},
bEyebrow:"For restaurant owners",bTitle:"List your restaurant",bSub:"Get a verified page with your photos, menu and a WhatsApp button, or a featured spot in your area, in front of Arabic and English-speaking diners. Contact me directly.",
plans:[["Basic","Free","",["Rating and opening hours","Directions button and menu link"]],["Verified","199","AED / month",["Verified badge and up to 5 photos","Menu link, WhatsApp and call buttons","Corrected details in Arabic and English","One current offer line"]],["Featured","499","AED / month",["Everything in Verified","Top 3 in your area's results (labelled Sponsored)","Written description in both languages","Monthly click report"]],["Premium","999","AED / month",["Everything in Featured","Homepage spotlight","Monthly reel in Arabic and English","Included in seasonal campaigns"]]],
yearly:"Pay yearly and get 2 months free.",
cTitle:"Contact me",cEmail:"Email",cPhone:"Phone / WhatsApp",cWa:"Message me on WhatsApp",copy:"Copy",copied:"Copied",copyFail:"Select the text and copy it manually",
fTitle:"Listing request",fName:"Restaurant name",fArea:"Area",fPerson:"Contact person",fPhone:"Contact number",fPlan:"Plan you're interested in",fMsg:"Message (optional)",fSend:"Send on WhatsApp",fCopy:"Copy message",fNeed:"Enter the restaurant name first.",
planOpts:["Basic (free)","Verified – AED 199","Featured – AED 499","Premium – AED 999","Not sure / general question"],
msgHead:"Listing request – Dubai Eats Atlas",mName:"Restaurant",mArea:"Area",mPerson:"Contact",mPhone:"Phone",mPlan:"Plan",mMsg:"Message",
foot1:"Ratings, review counts, hours and phone numbers come from Google Maps and were collected on 28 October 2026. They change often, so check the Google listing before you go.",
foot2:"Cost for two is an estimate based on Google's price level, before drinks. Business enquiries: iamaffanalikhan2017@gmail.com or +971 52 756 7142."}
};

const WA="971527567142";
const places=D.map((r,i)=>({name:r[0],area:r[1],cuisineAr:r[2],group:r[3],tier:r[4],rating:r[5],reviews:r[6],hoursAr:r[7],phone:r[8],mustAr:r[9],lat:r[10],lng:r[11],id:r[12],noteAr:r[13]||"",cuisineEn:EN[i][0],hoursEn:EN[i][1],mustEn:EN[i][2],noteEn:EN[i][3]||""}));
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uniq=a=>[...new Set(a)];
const app=$("#app");
let L="ar";
try{const s=localStorage.getItem("dea-lang");if(s==="en"||s==="ar")L=s}catch(e){}
const areaName=a=>L==="ar"?AREA_AR[a]:a, groupName=g=>L==="ar"?GROUP_AR[g]:g;
const tierSel=new Set();

function fillSelect(el,opts){const v=el.value;el.innerHTML=opts.map(([val,lab])=>`<option value="${esc(val)}">${esc(lab)}</option>`).join("");if([...el.options].some(o=>o.value===v))el.value=v}
function applyLang(){
  const t=T[L];
  app.lang=L;app.dir=L==="ar"?"rtl":"ltr";document.documentElement.lang=L;
  document.querySelectorAll("[data-t]").forEach(el=>{el.textContent=t[el.dataset.t]});
  document.querySelectorAll("[data-th]").forEach(el=>{el.innerHTML=t[el.dataset.th]});
  $("#langbtn").textContent=t.lang;
  $("#q").placeholder=t.ph;
  const coll=new Intl.Collator(L);
  fillSelect($("#area"),[["",t.allAreas],...uniq(places.map(p=>p.area)).sort((a,b)=>coll.compare(areaName(a),areaName(b))).map(a=>[a,areaName(a)])]);
  fillSelect($("#group"),[["",t.allGroups],...uniq(places.map(p=>p.group)).sort((a,b)=>coll.compare(groupName(a),groupName(b))).map(g=>[g,groupName(g)])]);
  fillSelect($("#minr"),[["0",t.any],...["4.5","4.7","4.8","4.9"].map(v=>[v,v+t.plus])]);
  fillSelect($("#sort"),[["rating",t.sRating],["reviews",t.sReviews],["cheap",t.sCheap],["name",t.sName]]);
  fillSelect($("#fPlan"),t.planOpts.map(o=>[o,o]));
  const tiers=$("#tiers");tiers.querySelectorAll("button").forEach(b=>b.remove());
  [1,2,3,4].forEach(n=>{const b=document.createElement("button");b.className="chipbtn";b.type="button";b.id="tier"+n;b.setAttribute("aria-pressed",tierSel.has(n));b.textContent=t.tiers[n][0];b.onclick=()=>{tierSel.has(n)?tierSel.delete(n):tierSel.add(n);b.setAttribute("aria-pressed",tierSel.has(n));render()};tiers.appendChild(b)});
  const total=places.reduce((s,p)=>s+p.reviews,0);
  $("#stats").innerHTML=`<div><b>${places.length}</b>${t.stR}</div><div><b>${uniq(places.map(p=>p.area)).length}</b>${t.stA}</div><div><b>${Math.round(total/1000)}${t.k}</b>${t.stV}</div>`;
  $("#plans").innerHTML=t.plans.map((p,i)=>`<div class="plan${i===2?" hl":""}"><h3>${esc(p[0])}</h3><div class="price">${esc(p[1])} <small>${esc(p[2])}</small></div><ul>${p[3].map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`).join("")+`<p class="sub" style="grid-column:1/-1;margin:4px 0 0">${esc(t.yearly)}</p>`;
  render();updateMsg();
}
function card(p){
  const t=T[L], ar=L==="ar";
  const maps=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name+" Dubai")}&query_place_id=${p.id}`;
  const dir=`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}&destination_place_id=${p.id}`;
  const menu=`https://www.google.com/search?q=${encodeURIComponent(p.name+" "+p.area+" Dubai menu")}`;
  const note=ar?p.noteAr:p.noteEn;
  return `<article class="card">
    <div class="card-head"><div><h2><bdi>${esc(p.name)}</bdi></h2><div class="meta">${esc(areaName(p.area))} · ${esc(ar?p.cuisineAr:p.cuisineEn)}</div></div>
    <div class="score"><b>${p.rating.toFixed(1)}</b> <span class="star" aria-hidden="true">★</span><small>${p.reviews.toLocaleString("en")} ${t.reviews}</small></div></div>
    <div class="tags"><span class="tag price">${t.tiers[p.tier][0]}</span><span class="tag">${esc(groupName(p.group))}</span></div>
    <dl>
      <dt>${t.dOrder}</dt><dd>${esc(ar?p.mustAr:p.mustEn)}</dd>
      <dt>${t.dCost}</dt><dd>${t.tiers[p.tier][1]} ${t.est}</dd>
      <dt>${t.dHours}</dt><dd>${esc(ar?p.hoursAr:p.hoursEn)}</dd>
      <dt>${t.dReach}</dt><dd>${esc(REACH[L][p.area])}</dd>
      ${p.phone?`<dt>${t.dPhone}</dt><dd><span class="ltr">${esc(p.phone)}</span></dd>`:""}
    </dl>
    ${note?`<div class="note">${esc(note)}</div>`:""}
    <div class="actions">
      <a class="btn primary" href="${dir}" target="_blank" rel="noopener">${t.bDir}</a>
      <a class="btn" href="${maps}" target="_blank" rel="noopener">${t.bMaps}</a>
      <a class="btn" href="${menu}" target="_blank" rel="noopener">${t.bMenu}</a>
    </div>
  </article>`;
}
function render(){
  const t=T[L];
  const q=$("#q").value.trim().toLowerCase(), a=$("#area").value, g=$("#group").value, mr=+$("#minr").value, so=$("#sort").value||"rating";
  let list=places.filter(p=>(!a||p.area===a)&&(!g||p.group===g)&&p.rating>=mr&&(!tierSel.size||tierSel.has(p.tier))&&(!q||[p.name,p.cuisineAr,p.cuisineEn,p.mustAr,p.mustEn,p.area,AREA_AR[p.area],p.group,GROUP_AR[p.group]].join(" ").toLowerCase().includes(q)));
  const by={rating:(x,y)=>y.rating-x.rating||y.reviews-x.reviews,reviews:(x,y)=>y.reviews-x.reviews,cheap:(x,y)=>x.tier-y.tier||y.rating-x.rating,name:(x,y)=>x.name.localeCompare(y.name)};
  list.sort(by[so]);
  $("#result").textContent=t.showing(list.length,places.length);
  $("#grid").innerHTML=list.length?list.map(card).join(""):`<p class="empty">${t.empty}</p>`;
}
function buildMsg(){
  const t=T[L],v=id=>$(id).value.trim();
  const lines=[t.msgHead,`${t.mName}: ${v("#fName")}`];
  if(v("#fArea"))lines.push(`${t.mArea}: ${v("#fArea")}`);
  if(v("#fPerson"))lines.push(`${t.mPerson}: ${v("#fPerson")}`);
  if(v("#fPhone"))lines.push(`${t.mPhone}: ${v("#fPhone")}`);
  lines.push(`${t.mPlan}: ${$("#fPlan").value}`);
  if(v("#fMsg"))lines.push(`${t.mMsg}: ${v("#fMsg")}`);
  return lines.join("\n");
}
function updateMsg(){$("#fSend").href=`https://wa.me/${WA}?text=${encodeURIComponent(buildMsg())}`}
["#fName","#fArea","#fPerson","#fPhone","#fPlan","#fMsg"].forEach(s=>$(s).addEventListener("input",()=>{updateMsg();$("#fStatus").textContent=""}));
$("#fSend").addEventListener("click",e=>{if(!$("#fName").value.trim()){e.preventDefault();$("#fStatus").textContent=T[L].fNeed;$("#fName").focus()}});
$("#inq").addEventListener("submit",e=>e.preventDefault());
async function copyText(txt,statusEl,fallbackEl){
  try{await navigator.clipboard.writeText(txt);statusEl.textContent=T[L].copied}
  catch(e){statusEl.textContent=T[L].copyFail;if(fallbackEl){const r=document.createRange();r.selectNodeContents(fallbackEl);const s=getSelection();s.removeAllRanges();s.addRange(r)}}
}
$("#fCopy").addEventListener("click",()=>copyText(buildMsg(),$("#fStatus")));
document.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",()=>{const el=document.getElementById(b.dataset.copy);copyText(el.textContent,b,el);setTimeout(()=>{b.textContent=T[L].copy},1600)}));
$("#langbtn").addEventListener("click",()=>{L=L==="ar"?"en":"ar";try{localStorage.setItem("dea-lang",L)}catch(e){}applyLang()});
["#q","#area","#group","#minr","#sort"].forEach(s=>$(s).addEventListener("input",render));
applyLang();
</script>

</body>
</html>
